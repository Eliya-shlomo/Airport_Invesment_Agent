[project]
name = "airport-agent"
version = "0.1.0"
description = "Conversational agent that ranks and compares US airports as expansion candidates"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.159.1",
    "httpx>=0.27",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "openai>=3.36.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
